name: CI · Windows

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  msvc:
    name: Ядро + сервер · Windows (MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Зависимости
        run: python -m pip install -r requirements/dev.txt
      - name: Сборка ядра (MSVC, x64)
        run: |
          cmake -S . -B build -A x64 -DPython3_EXECUTABLE="$((Get-Command python).Source)"
          cmake --build build --config Release --parallel
      - name: Тесты ядра
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Тесты Python — эталоны, сверка C с эталоном, лобби, API
        env:
          A112_REQUIRE_NATIVE: "1"
        run: python -m pytest
      - name: Сверка маршрутизации с кадрами стенда
        run: python tools/routing_reference.py
