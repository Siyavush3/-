# Настройки киоска тренажёра ДДС на рабочем месте обучающегося.
# Ключи командной строки и переменные окружения A112_SERVER / A112_BROWSER важнее этого файла.

# Адрес сервера тренажёра в учебном классе
SERVER=http://127.0.0.1:8112

# Браузер: auto | chrome | yandex | edge | chromium | firefox
# auto — первый найденный в этом порядке (chromium — только Ubuntu)
BROWSER=auto
