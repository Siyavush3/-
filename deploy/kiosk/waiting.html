<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Тренажёр ДДС · подключение</title>
<!-- Стартовая страница киоска: лежит на рабочем месте, поэтому открывается и при недоступном сервере.
     Проверяет сервер каждые 2 с и сама переходит ко входу. Внешних ресурсов нет — контур изолирован. -->
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: Roboto, "Segoe UI", "Helvetica Neue", Arial, sans-serif; color: #fff;
    background: linear-gradient(160deg, #6ea9d0 0%, #7cb4d6 45%, #93c3de 100%);
  }
  .box { width: 600px; }
  .logo { display: flex; align-items: flex-end; gap: 22px; }
  .n { font-size: 88px; line-height: 78px; font-weight: 300; letter-spacing: 2px; }
  .t { font-size: 30px; line-height: 38px; margin-bottom: 4px; }
  .msg { font-size: 22px; margin-top: 30px; }
  .dots span { animation: blink 1.4s infinite both; }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
  .addr { font-size: 15px; color: #1e5b8a; margin-top: 8px; }
  .hint { font-size: 15px; line-height: 21px; margin-top: 26px; }
</style>
</head>
<body>
<div class="box">
  <div class="logo"><span class="n">112</span><span class="t">ТРЕНАЖЁР ДДС</span></div>
  <div class="msg">Подключение к серверу тренажёра<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
  <div class="addr" id="addr"></div>
  <div class="hint" id="hint">Страница откроется сама, как только сервер ответит.</div>
</div>
<script>
(function () {
  'use strict';
  var addr = document.getElementById('addr');
  var hint = document.getElementById('hint');
  var raw = new URLSearchParams(location.search).get('server') || 'http://127.0.0.1:8112';
  var server;
  try {
    var url = new URL(raw);
    if (url.protocol !== 'http:' && url.protocol !== 'https:') throw new Error('protocol');
    server = url.origin + url.pathname.replace(/\/+$/, '');
  } catch (e) {
    addr.textContent = 'Неверный адрес сервера: ' + raw;
    hint.textContent = 'Исправьте SERVER в kiosk.conf и перезапустите киоск.';
    return;
  }
  addr.textContent = server;
  var tries = 0;
  function probe() {
    tries += 1;
    // no-cors: ответ непрозрачен, но запрос завершается без ошибки, только если сервер доступен
    fetch(server + '/api/health?t=' + Date.now(), { mode: 'no-cors', cache: 'no-store' })
      .then(function () { location.replace(server + '/'); })
      .catch(function () {
        if (tries === 8) hint.textContent = 'Сервер пока не отвечает. Если это затянулось — сообщите преподавателю.';
        setTimeout(probe, 2000);
      });
  }
  probe();
})();
</script>
</body>
</html>
